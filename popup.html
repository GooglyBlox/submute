<!DOCTYPE html>
<html>
  <head>
    <title>SubMute - Muted Subreddits</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        min-width: 250px;
        max-width: 300px;
        padding: 20px;
        background-color: #1a1a1b;
        color: #f1f1f1;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 15px;
      }

      #search-input {
        padding: 8px 12px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        background-color: #2c2c2c;
        color: #f1f1f1;
      }

      #search-input::placeholder {
        color: #888888;
      }

      .sort-container {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .sort-container input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .sort-container label {
        font-size: 14px;
        cursor: pointer;
      }

      #muted-list {
        list-style: none;
        padding: 0;
        max-height: 300px;
        overflow-y: auto;
      }

      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        margin-bottom: 8px;
        background-color: #2c2c2c;
        border-radius: 4px;
        transition: background-color 0.3s;
      }

      li:hover {
        background-color: #3a3a3a;
      }

      .subreddit-name {
        font-size: 14px;
        color: #ff4500;
        max-width: 160px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        position: relative;
        cursor: default;
      }

      .subreddit-name:hover::after {
        content: attr(data-fullname);
        position: absolute;
        left: 0;
        top: 100%;
        background-color: #333;
        color: #fff;
        padding: 5px 8px;
        border-radius: 4px;
        white-space: normal;
        box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.3);
        z-index: 10;
        width: max-content;
        max-width: 200px;
        margin-top: 5px;
      }

      .unmute-button {
        background-color: #ff4500;
        border: none;
        color: white;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 12px;
        transition: background-color 0.3s;
        flex-shrink: 0;
      }

      .unmute-button:hover {
        background-color: #e03d00;
      }

      .no-muted {
        text-align: center;
        color: #cccccc;
        font-style: italic;
        padding: 20px 0;
      }

      #muted-list::-webkit-scrollbar {
        width: 6px;
      }

      #muted-list::-webkit-scrollbar-track {
        background: #1a1a1b;
        border-radius: 3px;
      }

      #muted-list::-webkit-scrollbar-thumb {
        background: #ff4500;
        border-radius: 3px;
      }

      #muted-list::-webkit-scrollbar-thumb:hover {
        background: #e03d00;
      }

      .header-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #ff4500;
        padding-bottom: 10px;
        margin-bottom: 15px;
      }

      h2 {
        margin: 0;
        font-size: 18px;
        color: #f1f1f1;
      }

      .github-link {
        color: #f1f1f1;
        transition: color 0.3s;
        display: flex;
        align-items: center;
      }

      .github-link:hover {
        color: #ff4500;
      }
    </style>
  </head>

  <body>
    <div class="header-container">
      <h2>Muted Subreddits</h2>
      <a
        href="https://github.com/GooglyBlox/submute"
        target="_blank"
        class="github-link"
        title="View source on GitHub"
      >
        <svg height="24" width="24" viewBox="0 0 16 16">
          <path
            fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </div>
    <div class="controls">
      <input
        type="text"
        id="search-input"
        placeholder="Search muted subreddits"
      />
      <div class="sort-container">
        <input type="checkbox" id="sort-checkbox" />
        <label for="sort-checkbox">Sort alphabetically</label>
      </div>
    </div>
    <ul id="muted-list">
      <li class="no-muted">No muted subreddits.</li>
    </ul>
    <script src="popup.js"></script>
  </body>
</html>
